<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#121212;--c1:#1E1E1E;--c2:#252525;--bd:#2E2E2E;--t1:rgba(255,255,255,.87);--t2:rgba(255,255,255,.6);--t3:rgba(255,255,255,.38);--grn:#4CAF50;--grn2:#2E7D32;--amb:#FF9800;--red:#F44336;--blu:#42A5F5;--ovBg:rgba(0,0,0,.8);--shd:0 8px 32px rgba(0,0,0,.5);--fab-shd:0 4px 20px rgba(76,175,80,.35);color-scheme:dark}
@media(prefers-color-scheme:light){
  :root{--bg:#F7F8FA;--c1:#FFFFFF;--c2:#F0F2F5;--bd:#E1E4E8;--t1:rgba(0,0,0,.87);--t2:rgba(0,0,0,.62);--t3:rgba(0,0,0,.42);--grn:#2E7D32;--grn2:#1B5E20;--amb:#E65100;--red:#C62828;--blu:#1565C0;--ovBg:rgba(0,0,0,.55);--shd:0 4px 16px rgba(0,0,0,.12);--fab-shd:0 4px 16px rgba(46,125,50,.3);color-scheme:light}
  input[type="date"]::-webkit-calendar-picker-indicator{filter:none}
}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;-webkit-tap-highlight-color:transparent}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.8)}
select{appearance:auto}textarea{resize:vertical}

.toast{position:fixed;top:env(safe-area-inset-top,8px);left:50%;transform:translateX(-50%);z-index:9999;background:var(--c1);border:1px solid var(--bd);border-radius:14px;padding:12px 24px;font-size:15px;font-weight:600;box-shadow:var(--shd);animation:fadeIn .25s;max-width:92vw;text-align:center}
.hdr{background:var(--grn2);padding:0 16px;padding-top:env(safe-area-inset-top,0px)}
.hdr-in{display:flex;justify-content:space-between;align-items:center;max-width:700px;margin:0 auto;padding:18px 0;min-height:60px}
.nav{display:flex;background:var(--c1);border-bottom:1px solid var(--bd);padding:4px;position:sticky;top:0;z-index:100}
.nb{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;padding:8px 2px;border:none;border-radius:10px;background:transparent;color:var(--t3);cursor:pointer;font-family:inherit}
.nb.on{background:var(--c2);color:var(--grn)}
.nb-i{font-size:18px}.nb-l{font-size:10px;font-weight:700}
.main{max-width:700px;margin:0 auto;padding:16px 12px 120px}
.crd{background:var(--c1);border-radius:18px;padding:18px;border:1px solid var(--bd);margin-bottom:12px}
.sec-t{font-size:18px;font-weight:800;margin-bottom:16px}
.btn-m{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--grn);color:#fff;border:none;border-radius:16px;padding:16px 28px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;min-height:54px;width:100%}
.btn-s{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--c2);color:var(--t2);border:1px solid var(--bd);border-radius:16px;padding:16px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;min-height:54px;width:100%}
.flt{display:flex;align-items:center;gap:8px;background:var(--c1);border-radius:14px;padding:10px 14px;margin-bottom:16px;border:1px solid var(--bd)}
.di{background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;color:var(--t1);font-size:14px;flex:1;min-width:90px;font-family:inherit}
.fl{font-size:13px;color:var(--t2);margin-bottom:8px;font-weight:700}
.fi{width:100%;background:var(--c2);border:1.5px solid var(--bd);border-radius:14px;padding:14px 16px;color:var(--t1);font-size:16px;font-family:inherit;outline:none;box-sizing:border-box}
.fi:focus{border-color:var(--grn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pay-t{border:none;border-radius:10px;padding:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center}
.pay-t.ok{background:rgba(76,175,80,.12);color:var(--grn)}
.pay-t.no{background:rgba(255,152,0,.12);color:var(--amb)}
.cbtn{background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:10px 18px;color:var(--t2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;min-height:44px}
.fab{position:fixed;bottom:24px;right:16px;width:60px;height:60px;border-radius:50%;background:var(--grn);color:#fff;border:none;cursor:pointer;font-size:22px;box-shadow:var(--fab-shd);display:flex;align-items:center;justify-content:center;z-index:100}
.ov{position:fixed;inset:0;background:var(--ovBg);z-index:5000;display:flex;align-items:center;justify-content:center;padding:16px}
.sync-btn{background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:8px;position:relative}

/* === Header logo: spinning soccer ball + kick easter egg === */
.hdr-ball{width:38px;height:38px;background:rgba(255,255,255,.15);border-radius:10px;flex-shrink:0;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color .2s ease}
.hdr-ball:hover{background:rgba(255,255,255,.22)}
.hdr-ball:active{background:rgba(255,255,255,.28)}
.hdr-ball-svg{width:26px;height:26px;animation:hdr-ball-spin 6s linear infinite;will-change:transform;transform-origin:center}
.hdr-ball.kick .hdr-ball-svg{animation:hdr-ball-kick .9s cubic-bezier(.2,1.2,.4,1)}
@keyframes hdr-ball-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes hdr-ball-kick{
  0%{transform:translateY(0) rotate(0)}
  28%{transform:translateY(-12px) rotate(380deg) scale(1.1)}
  52%{transform:translateY(0) rotate(560deg)}
  72%{transform:translateY(-6px) rotate(680deg) scale(1.05)}
  88%{transform:translateY(0) rotate(740deg)}
  100%{transform:translateY(0) rotate(720deg)}
}
.sync-spin{animation:sp 1s linear infinite;display:inline-block}
.sync-pulse{animation:sync-pulse .65s ease-out;display:inline-block}
@keyframes sync-pulse{0%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}45%{transform:scale(1.35);filter:drop-shadow(0 0 10px rgba(76,175,80,.85))}100%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}}

/* === Ball-rolling button (main save / commit actions) === */
.ball-btn{position:relative;overflow:hidden;isolation:isolate;transition:transform .12s ease}
.ball-btn:active{transform:scale(.985)}
.ball-btn .ball-text{transition:opacity .2s ease, transform .2s ease;display:inline-flex;align-items:center;gap:8px}
.ball-btn .ball-svg{position:absolute;top:50%;left:-40px;width:30px;height:30px;margin-top:-15px;opacity:0;will-change:left,transform}
.ball-btn .ball-dash{position:absolute;left:14%;right:14%;top:50%;height:2px;margin-top:-1px;background-image:linear-gradient(to right,rgba(255,255,255,.7) 50%,transparent 50%);background-size:10px 2px;opacity:0;transform-origin:left center;transform:scaleX(0)}
.ball-btn .ball-check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
.ball-btn .ball-check svg{width:32px;height:32px}
.ball-btn .ball-check path{stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:30;stroke-dashoffset:30}

.ball-btn.rolling .ball-text{opacity:0;transform:scale(.85)}
.ball-btn.rolling .ball-svg{animation:ball-roll .85s cubic-bezier(.45,.05,.55,.95) forwards}
.ball-btn.rolling .ball-dash{animation:ball-dash .85s ease-out forwards}
.ball-btn.done .ball-text{opacity:0}
.ball-btn.done .ball-check{animation:ball-check-pop .42s cubic-bezier(.2,1.3,.4,1) forwards}
.ball-btn.done .ball-check path{animation:ball-check-draw .35s .15s ease-out forwards}

@keyframes ball-roll{
  0%{opacity:0;left:-40px;transform:rotate(0)}
  6%{opacity:1;left:-30px}
  92%{opacity:1;left:calc(100% + 10px);transform:rotate(720deg)}
  100%{opacity:0;left:calc(100% + 14px);transform:rotate(720deg)}
}
@keyframes ball-dash{
  0%{opacity:0;transform:scaleX(0)}
  20%{opacity:.65;transform:scaleX(.2)}
  85%{opacity:.45;transform:scaleX(1)}
  100%{opacity:0;transform:scaleX(1)}
}
@keyframes ball-check-pop{
  0%{opacity:0;transform:scale(.4)}
  60%{opacity:1;transform:scale(1.1)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes ball-check-draw{to{stroke-dashoffset:0}}

/* === Pay-t (mark paid) burst === */
.pay-t{position:relative;overflow:visible;transition:transform .15s ease, background-color .35s ease, color .35s ease}
.pay-t:active{transform:scale(.94)}
.pay-t.burst{animation:pay-burst .5s cubic-bezier(.2,1.3,.4,1)}
.pay-t.burst::before{content:"";position:absolute;inset:-2px;border-radius:12px;border:2px solid currentColor;opacity:.6;animation:pay-burst-ring .55s ease-out forwards;pointer-events:none;box-sizing:border-box}
@keyframes pay-burst{
  0%{transform:scale(1)}
  35%{transform:scale(.9)}
  60%{transform:scale(1.12)}
  100%{transform:scale(1)}
}
@keyframes pay-burst-ring{
  0%{transform:scale(1);opacity:.55}
  100%{transform:scale(1.4);opacity:0}
}

/* Confetti particles (Google Tasks style) — 8 dots in 4 brand colors flying outward */
.pay-t .particles{position:absolute;inset:0;pointer-events:none}
.pay-t .particles span{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;margin:-2.5px 0 0 -2.5px;opacity:0;will-change:transform,opacity}
.pay-t.burst .particles span{animation:particle-fly .58s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes particle-fly{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  18%{opacity:1;transform:translate(calc(var(--x) * .35), calc(var(--y) * .35)) scale(1)}
  100%{opacity:0;transform:translate(var(--x), var(--y)) scale(.6)}
}

/* === Undo snackbar (Google Tasks style) === */
.undo-bar{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,0);z-index:9998;background:#1d1d1d;color:#fff;border-radius:12px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(0,0,0,.45);max-width:92vw;font-size:14px;font-weight:600;animation:undo-in .28s ease-out;line-height:1.3}
.undo-btn{background:none;border:none;color:#7BB7FF;font-size:14px;font-weight:800;padding:10px 14px;cursor:pointer;font-family:inherit;border-radius:8px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;flex-shrink:0}
.undo-btn:active{background:rgba(123,183,255,.2)}
@keyframes undo-in{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* === FAB pop in + ripple === */
.fab{animation:fab-pop .4s cubic-bezier(.2,1.4,.4,1) backwards;transition:transform .12s ease, box-shadow .2s ease}
.fab:hover{transform:scale(1.05)}
.fab:active{transform:scale(.92)}
@keyframes fab-pop{
  0%{transform:scale(0) rotate(-180deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}
}

/* === Tab nav: pop on activate, smooth color === */
.nb{transition:background-color .25s ease, color .25s ease}
.nb-i{transition:transform .25s ease;display:inline-block}
.nb.on .nb-i{animation:tab-pop .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes tab-pop{
  0%{transform:scale(.7)}
  55%{transform:scale(1.25)}
  100%{transform:scale(1)}
}

@media(min-width:768px){.fi{font-size:17px;padding:16px 18px}.btn-m,.btn-s{font-size:17px;min-height:58px}.nb{padding:10px 8px}.nb-i{font-size:20px}.nb-l{font-size:12px}}
@media(prefers-reduced-motion:reduce){.ball-btn .ball-svg,.ball-btn .ball-dash,.ball-btn .ball-check,.ball-btn .ball-check path,.fab,.nb.on .nb-i,.sync-pulse,.hdr-ball-svg,.pay-t.burst,.pay-t.burst::before,.pay-t.burst .particles span,.undo-bar{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>

  const firebaseConfig = {

    authDomain: "var-tracker.firebaseapp.com",
    projectId: "var-tracker",

<script type="text/babel">

var SYNC_URL = "https://script.google.com/macros/s/AKfycbwSE772NYibPpjceErmLdBHX7X-Y2ZvqGvBpXaNxZsPATP_s1DiwIVAVcO05X6wHnd7AA/exec";
// ============================================================

var STORE="var-tracker-v5";
var ROSTER_STORE="var-tracker-roster-v1";
// Default roster — extracted from your Zalo group (32 thành viên gồm cả bạn).
// You can add/remove names live in the app via the ⚙️ button next to the team

var DEFAULT_ROSTER=[
  "A Giap Tekcast","Cường Xuân Trần","A An Tp Kt Vtv8","A Dương Bảo Bệ Tekcast",

  "Bảo Duy","Bảy Hoàng","Bạo Võ Xuân","Chau Ban bien tap cap",
  "Cuongpm (a Cường toác vtv)","Duy Long","Hải Huỳnh","Hieu Vtvcab",
  "Hoàng Thiều Huy","Huygia","Hưng Nguyễn Đăng","Khánh Vtv Đà Nẵng - Lắp Đặt",
  "Long Nguyễn Bảo","Long Vtv8","Nam Hoai Tekcast","Ngoc Khac",
  "Nguyen Anh","Nguyễn Đăng Quang","Phamcongthanh","Thanh Phong","Thịnh Vtvcab Tdps",
  "Trần Minh Hoàng","Van Tu","VietLe",

];
// Vietnamese diacritic-insensitive normalize for fuzzy typeahead search.
// "hư" matches "Hưng", "Hư"; "long" matches "Long Vtv8" etc. Lowercase + strip
// combining marks + đ→d so users don't have to type tone marks.
function normVN(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");}
var VN={"Hàng Đẫy":{x:1},"Mỹ Đình":{x:1},"Hải Phòng":{x:1},"Thanh Hoá":{x:1},"Ninh Bình":{x:1},"Nam Định":{x:1},"VPF Hưng Yên":{x:1},"Vinh":{x:1.5},"Hà Tĩnh":{x:2},"Khác":{x:1}};
// Stadium identity: abbreviation + color for timeline markers
var VS={"Hàng Đẫy":{a:"HĐ",c:"#7B1FA2"},"Mỹ Đình":{a:"MĐ",c:"#C62828"},"Hải Phòng":{a:"HP",c:"#BF360C"},"Thanh Hoá":{a:"TH",c:"#E65100"},"Ninh Bình":{a:"NB",c:"#2E7D32"},"Nam Định":{a:"NĐ",c:"#558B2F"},"VPF Hưng Yên":{a:"VPF",c:"#01579B"},"Vinh":{a:"VINH",c:"#4E342E"},"Hà Tĩnh":{a:"HT",c:"#880E4F"},"Khác":{a:"?",c:"#455A64"}};
// Default home team per venue
var VH={"Hàng Đẫy":"Hà Nội FC","Mỹ Đình":"","Hải Phòng":"CLB Hải Phòng","Thanh Hoá":"Đông Á Thanh Hoá","Ninh Bình":"Phù Đổng Ninh Bình","Nam Định":"Thép Xanh Nam Định","VPF Hưng Yên":"PVF CAND","Vinh":"SLNA","Hà Tĩnh":"Hồng Lĩnh Hà Tĩnh","Khác":""};

}

var DW=["T2","T3","T4","T5","T6","T7","CN"];

function vnd(n){return new Intl.NumberFormat("vi-VN").format(n)+"đ";}
function fmM(n){return n?new Intl.NumberFormat("vi-VN").format(n):"";}
function fd(s){if(!s)return"";var d=new Date(s),w=["CN","T2","T3","T4","T5","T6","T7"];return w[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
// Relative time for a date value (string yyyy-mm-dd, dd/mm/yyyy, Date object, or
// timestamp). Returns either {solo:"..."} for single-line labels or
// {big:N, small:"unit", future:bool} for two-line. Approximate by design.
function relTime(s){
  if(!s)return null;
  var d=null;
  if(s instanceof Date){d=s;}
  else if(typeof s==="number"){d=new Date(s);}
  else if(typeof s==="string"){
    var t=s.trim();
    var iso=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
    if(iso){d=new Date(+iso[1],+iso[2]-1,+iso[3]);}
    else{
      var dmy=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/.exec(t);
      if(dmy){d=new Date(+dmy[3],+dmy[2]-1,+dmy[1]);} // Vietnamese DD/MM/YYYY
      else{d=new Date(t);} // last-resort native parser
    }
  }
  if(!d||isNaN(d.getTime()))return null;
  var dDay=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var n=new Date();
  var today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var diff=Math.round((today-dDay)/86400000); // positive = past
  if(diff===0)return{solo:"Hôm nay"};
  if(diff===1)return{solo:"Hôm qua"};
  if(diff===-1)return{solo:"Ngày mai"};
  var future=diff<0,abs=Math.abs(diff);
  if(abs<7)return{big:abs,small:"ngày",future:future};
  if(abs<28){var w=Math.round(abs/7);return{big:w,small:"tuần",future:future};}
  if(abs<365){var m=Math.round(abs/30);return{big:m,small:"tháng",future:future};}
  return{big:Math.round(abs/365),small:"năm",future:future};
}
// Normalize any date string (ISO or YYYY-MM-DD) to local YYYY-MM-DD
function nDate(s){if(!s)return"";var d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function mk(){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:"",time:"",venue:"",customVenue:"",homeTeam:"",awayTeam:"",competition:"V.League 1",round:"",salary:2500000,travelMul:1,travelBase:300000,travelExtra:0,travelNote:"",salaryPaid:false,travelPaid:false,leader:"Nguyễn Đăng Quang",tech:"",ro:"",driver:"",vpf:"",note:"",files:[],updatedAt:Date.now()};}
function tA(e){return e.travelBase*e.travelMul+(e.travelExtra||0);}
function compress(url,mx){mx=mx||1200;return new Promise(function(r){var i=new Image();i.onload=function(){var c=document.createElement("canvas"),s=i.width>mx?mx/i.width:1;c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7));};i.onerror=function(){r(url);};i.src=url;});}
function readF(f){return new Promise(function(r,j){var x=new FileReader();x.onload=function(){r(x.result);};x.onerror=j;x.readAsDataURL(f);});}
function dlFile(u,n){var a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);}
// Convert data: URI to Blob URL (Chrome/Safari block data: URIs in iframes for security,
// causing PDF preview to show a blank white page. Blob URLs are allowed.)
function dataURItoBlobURL(u){try{if(!u||u.indexOf("data:")!==0)return u;var p=u.split(",");var m=(p[0].match(/data:([^;]+)/)||[,"application/octet-stream"])[1];var b=atob(p[1]);var a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:m}));}catch(e){return u;}}
// Robust file-data validity check (catches truncated/empty/corrupted data URIs that
// would otherwise render as a blank iframe)
function fOK(f){if(!f||typeof f.data!=="string")return false;if(f.data.length<50)return false;if(f.data.indexOf("data:")!==0)return false;var c=f.data.indexOf(",");return c>5&&(f.data.length-c-1)>20;}

// Drive integration via Apps Script
async function driveUpload(name,type,dataB64){if(!SYNC_URL)return null;try{var r=await fetch(SYNC_URL+"?action=uploadFile",{method:"POST",body:JSON.stringify({name:name,type:type,dataB64:dataB64}),headers:{"Content-Type":"text/plain"}});var j=await r.json();if(j&&j.ok&&j.id)return j.id;console.warn("Drive upload error:",j&&j.error);}catch(e){console.warn("Drive upload fail:",e);}return null;}
async function driveDownload(id){if(!SYNC_URL||!id)return null;try{var r=await fetch(SYNC_URL+"?action=getFile&id="+encodeURIComponent(id));var j=await r.json();if(j&&j.ok&&j.data)return{data:j.data,name:j.name,type:j.type};console.warn("Drive download error:",j&&j.error);}catch(e){console.warn("Drive download fail:",e);}return null;}

// Local storage
function loadLocal(){try{var d=localStorage.getItem(STORE);return d?JSON.parse(d):[];}catch(e){return[];}}
function saveLocal(data){try{localStorage.setItem(STORE,JSON.stringify(data));}catch(e){}}
// Roster (team-member name list) persistence — small enough to live entirely in
// localStorage; sync to Sheets is optional and handled lazily next save.
function loadRoster(){
  try{
    var d=localStorage.getItem(ROSTER_STORE);
    if(!d)return DEFAULT_ROSTER.slice();
    var stored=JSON.parse(d);
    if(!Array.isArray(stored))return DEFAULT_ROSTER.slice();
    // Migration: merge in any new names from DEFAULT_ROSTER that aren't already
    // present (compared diacritic-insensitively). Lets us ship roster updates
    // without users losing their custom additions or seeing duplicates.
    var have={};stored.forEach(function(n){have[normVN(n)]=true;});
    var merged=stored.slice();
    DEFAULT_ROSTER.forEach(function(n){if(!have[normVN(n)])merged.push(n);});
    return merged;
  }catch(e){return DEFAULT_ROSTER.slice();}
}
function saveRoster(r){try{localStorage.setItem(ROSTER_STORE,JSON.stringify(r));}catch(e){}}

// === Firestore realtime sync ===
// Document path: /tracker/var (single doc, contains entire data array). Small
// dataset (~hundreds of matches × ~1KB metadata each) so monolithic doc is
// simpler than collection-per-entry and keeps cost low. Files stay in Drive.
var FB_DOC_PATH=["tracker","var"]; // doc(db,"tracker","var")
function fbReady(){return !!(window.__fb&&window.__fb.db);}
function fbDocRef(){var f=window.__fb;return f.doc(f.db,FB_DOC_PATH[0],FB_DOC_PATH[1]);}

// Push current data to Firestore. Files keep only metadata (driveId), not bytes.
async function fbPush(data){
  if(!fbReady())return false;
  try{
    var clean=data.map(function(e){return Object.assign({},e,{files:(e.files||[]).map(function(f){return{name:f.name,type:f.type,driveId:f.driveId||null};})});});
    await window.__fb.setDoc(fbDocRef(),{entries:clean,updatedAt:window.__fb.serverTimestamp()},{merge:true});
    return true;
  }catch(e){console.warn("Firestore push fail:",e);return false;}
}

// Subscribe to Firestore changes; returns unsubscribe function.
function fbSubscribe(cb){
  if(!fbReady())return function(){};
  try{
    return window.__fb.onSnapshot(fbDocRef(),function(snap){
      if(!snap.exists())return cb([]);
      var d=snap.data();cb(Array.isArray(d.entries)?d.entries:[]);
    },function(err){console.warn("Firestore subscribe error:",err);});
  }catch(e){console.warn("Firestore subscribe fail:",e);return function(){};}
}

function fmtTime(t){if(!t)return"";var d=new Date(t),now=new Date(),diff=(now-d)/1000;if(diff<60)return"vừa xong";if(diff<3600)return Math.floor(diff/60)+"p trước";if(diff<86400)return Math.floor(diff/3600)+"h trước";return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

// Merge files arrays by name: keep local data (heavy bytes), fill in driveId
// from cloud when local hasn't been uploaded yet, and append cloud-only files
// (those exist on Drive but weren't downloaded to this device yet).
function mergeFiles(lf,cf){
  var L=Array.isArray(lf)?lf:[],C=Array.isArray(cf)?cf:[];
  var byName={};C.forEach(function(f){if(f&&f.name)byName[f.name]=f;});
  var seen={};
  var out=L.map(function(f){if(!f||!f.name)return f;seen[f.name]=1;var c=byName[f.name];if(c&&c.driveId&&!f.driveId)return Object.assign({},f,{driveId:c.driveId});return f;});
  C.forEach(function(f){if(f&&f.name&&!seen[f.name])out.push(f);});
  return out;
}

// Merge cloud + local: prefer entry with newer updatedAt to avoid losing
// recent local edits when cloud hasn't been pushed yet.
function smartMerge(cloud,local){
  var byId={};
  cloud.forEach(function(c){byId[c.id]=c;});
  local.forEach(function(l){
    var c=byId[l.id];
    if(!c){byId[l.id]=l;return;}
    var lu=l.updatedAt||0,cu=c.updatedAt||0;
    var winner=lu>cu?l:c;
    // Smart-merge files: local owns the bytes, cloud owns driveId pointers
    byId[l.id]=Object.assign({},winner,{files:mergeFiles(l.files,c.files)});
  });
  return Object.keys(byId).map(function(k){return byId[k];});
}

// Typeahead input for picking a team-member name from a roster, with diacritic-
// insensitive search. Supports keyboard navigation (↑↓ Enter Esc) and free-text
// (you can type a name not in the roster — typed value is kept verbatim).
function NameInput(p){
  var roster=p.roster||[],value=p.value||"",onChange=p.onChange||function(){};
  var[open,setOpen]=React.useState(false);
  var[hi,setHi]=React.useState(0); // highlighted suggestion index
  var ref=React.useRef(null);
  var n=normVN(value);
  // Suggest if typed at least 1 char; rank prefix matches first, then substring.
  var suggestions=React.useMemo(function(){
    if(!n)return [];
    var pref=[],sub=[];
    roster.forEach(function(name){
      var nn=normVN(name);
      if(nn===n)return; // skip exact match (already typed)
      if(nn.indexOf(n)===0)pref.push(name);
      else if(nn.indexOf(" "+n)>-1||nn.indexOf(n)>-1)sub.push(name);
    });
    return pref.concat(sub).slice(0,8);
  },[n,roster]);
  React.useEffect(function(){setHi(0);},[n]);
  React.useEffect(function(){
    function onDoc(ev){if(ref.current&&!ref.current.contains(ev.target))setOpen(false);}
    document.addEventListener("mousedown",onDoc);
    return function(){document.removeEventListener("mousedown",onDoc);};
  },[]);
  function pick(name){onChange(name);setOpen(false);}
  function onKey(ev){
    if(!open||suggestions.length===0)return;
    if(ev.key==="ArrowDown"){ev.preventDefault();setHi(function(h){return (h+1)%suggestions.length;});}
    else if(ev.key==="ArrowUp"){ev.preventDefault();setHi(function(h){return (h-1+suggestions.length)%suggestions.length;});}
    else if(ev.key==="Enter"){ev.preventDefault();pick(suggestions[hi]);}
    else if(ev.key==="Escape"){setOpen(false);}
  }
  return <div ref={ref} style={{position:"relative"}}>
    <input type="text" className="fi" value={value}
      onChange={function(e){onChange(e.target.value);setOpen(true);}}
      onFocus={function(){setOpen(true);}}
      onKeyDown={onKey}
      placeholder={p.placeholder||""}
      autoComplete="off"
    />
    {open&&suggestions.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,marginTop:4,background:"var(--c1)",border:"1px solid var(--bd)",borderRadius:12,boxShadow:"0 8px 24px rgba(0,0,0,.4)",zIndex:50,maxHeight:240,overflowY:"auto"}}>
      {suggestions.map(function(name,i){return <button key={name} type="button" onMouseDown={function(ev){ev.preventDefault();pick(name);}} onMouseEnter={function(){setHi(i);}}
        style={{display:"block",width:"100%",textAlign:"left",padding:"10px 14px",background:i===hi?"var(--c2)":"transparent",border:"none",color:"var(--t1)",fontSize:14,cursor:"pointer",fontFamily:"inherit",borderBottom:i<suggestions.length-1?"1px solid var(--bd)":"none"}}>
        {name}
      </button>;})}
    </div>}
  </div>;
}

// Modal for adding/removing/editing team-member names. Sorts alphabetically
// (Vietnamese-aware) and supports inline rename. Names are persisted by App.
function RosterModal(p){
  var[input,setInput]=React.useState("");
  var[editIdx,setEditIdx]=React.useState(-1);
  var[editVal,setEditVal]=React.useState("");
  function add(){
    var v=input.trim();if(!v)return;
    if(p.roster.some(function(x){return normVN(x)===normVN(v);})){setInput("");return;}
    p.setRoster(p.roster.concat([v]).sort(function(a,b){return a.localeCompare(b,"vi");}));
    setInput("");
  }
  function rm(i){p.setRoster(p.roster.filter(function(_,j){return j!==i;}));}
  function commitEdit(i){
    var v=editVal.trim();if(!v){setEditIdx(-1);return;}
    p.setRoster(p.roster.map(function(x,j){return j===i?v:x;}).sort(function(a,b){return a.localeCompare(b,"vi");}));
    setEditIdx(-1);setEditVal("");
  }
  return <div className="ov" onClick={p.onClose}>
    <div onClick={function(e){e.stopPropagation();}} style={{background:"var(--c1)",borderRadius:20,padding:24,maxWidth:500,width:"100%",maxHeight:"80vh",display:"flex",flexDirection:"column"}}>
      <div style={{fontSize:17,fontWeight:800,marginBottom:4}}>👥 Danh sách nhân sự</div>
      <div style={{fontSize:13,color:"var(--t3)",marginBottom:14}}>{p.roster.length} người · gõ tên để autocomplete khi thêm trận</div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <input type="text" value={input} onChange={function(e){setInput(e.target.value);}} onKeyDown={function(e){if(e.key==="Enter")add();}} placeholder="Tên người mới..." className="fi" style={{flex:1}}/>
        <button onClick={add} disabled={!input.trim()} className="btn-s" style={{minWidth:80,opacity:input.trim()?1:.5}}>＋ Thêm</button>
      </div>
      <div style={{flex:1,overflowY:"auto",border:"1px solid var(--bd)",borderRadius:12,background:"var(--c2)"}}>
        {p.roster.length===0?<div style={{padding:24,textAlign:"center",color:"var(--t3)",fontSize:13}}>Chưa có ai. Thêm người ở trên.</div>:
        p.roster.map(function(name,i){return <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:i<p.roster.length-1?"1px solid var(--bd)":"none"}}>
          {editIdx===i?
            <><input type="text" value={editVal} onChange={function(e){setEditVal(e.target.value);}} onKeyDown={function(e){if(e.key==="Enter")commitEdit(i);if(e.key==="Escape")setEditIdx(-1);}} className="fi" style={{flex:1,padding:"6px 10px",fontSize:14}} autoFocus/>
            <button onClick={function(){commitEdit(i);}} className="cbtn" style={{padding:"4px 10px",color:"var(--grn)"}}>✓</button>
            <button onClick={function(){setEditIdx(-1);}} className="cbtn" style={{padding:"4px 10px"}}>✕</button></>
          :
            <><span style={{flex:1,fontSize:14,color:"var(--t1)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{name}</span>
            <button onClick={function(){setEditIdx(i);setEditVal(name);}} className="cbtn" style={{padding:"4px 10px",color:"var(--blu)"}} aria-label="Sửa">✎</button>
            <button onClick={function(){rm(i);}} className="cbtn" style={{padding:"4px 10px",color:"var(--red)"}} aria-label="Xoá">🗑</button></>
          }
        </div>;})}
      </div>
      <button onClick={p.onClose} style={{width:"100%",marginTop:14,background:"var(--c2)",border:"1px solid var(--bd)",borderRadius:14,padding:14,fontSize:15,fontWeight:700,color:"var(--t2)",cursor:"pointer",fontFamily:"inherit"}}>Đóng</button>
    </div>
  </div>;
}

function App(){
  var[data,setData]=React.useState([]);
  var[tab,setTab]=React.useState("timeline");
  var[eid,setEid]=React.useState(null);
  var[form,setForm]=React.useState(mk());
  var[dFrom,setDFrom]=React.useState("");
  var[dTo,setDTo]=React.useState("");
  var[preset,setPreset]=React.useState("");
  var[search,setSearch]=React.useState("");
  var[showPaid,setShowPaid]=React.useState(false);
  var[sType,setSType]=React.useState("travel");
  var[loaded,setLoaded]=React.useState(false);
  var[delId,setDelId]=React.useState(null);
  var[toast,setToast]=React.useState(null);
  var[syncing,setSyncing]=React.useState(false);
  var[lastSync,setLastSync]=React.useState(null);
  var pushTimerRef=React.useRef(null);
  var pendingRef=React.useRef(false);
  var uploadingRef=React.useRef({}); // map "entryId-fileName" -> true while uploading to Drive
  var[fetchingFile,setFetchingFile]=React.useState(false);
  var[saving,setSaving]=React.useState(false);    // ball rolling on main Save
  var[saved,setSaved]=React.useState(false);      // checkmark visible briefly after save
  var[markAllAnim,setMarkAllAnim]=React.useState(null); // "salary"|"travel" while ball-anim runs
  var[syncPulse,setSyncPulse]=React.useState(false);
  var[ballKick,setBallKick]=React.useState(false); // header ball easter-egg burst
  var[roster,setRoster]=React.useState(loadRoster);
  var[rosterModal,setRosterModal]=React.useState(false);
  React.useEffect(function(){saveRoster(roster);},[roster]);
  var[undoData,setUndoData]=React.useState(null); // {id, field, wasPaid} for undo snackbar
  var undoTimerRef=React.useRef(null);
  var[preview,setPreview]=React.useState(null);
  var[previewURL,setPreviewURL]=React.useState(null);
  var[fModal,setFModal]=React.useState(null);
  var now=new Date();
  var[calY,setCalY]=React.useState(now.getFullYear());
  var[calM,setCalM]=React.useState(now.getMonth());
  var[calSel,setCalSel]=React.useState(null);
  var aiRef=React.useRef(null);
  var fileRef=React.useRef(null);

  // === Firestore realtime sync ===
  // Pattern: subscribe once to the doc; every write from any device flows back
  // through onSnapshot. Local writes are written-then-listened (we get our own
  // changes back ~instantly, which is fine — setData with same content is no-op).
  // applyingRemoteRef guards against the push effect refiring on data we just
  // received from the listener (would create an infinite write loop).
  var applyingRemoteRef=React.useRef(false);
  var dataRef=React.useRef([]);
  var flushInProgressRef=React.useRef(false);
  var fbReadyState=React.useState(fbReady());
  var fbIsReady=fbReadyState[0],setFbIsReady=fbReadyState[1];

  React.useEffect(function(){dataRef.current=data;},[data]);

  function pushNow(opts){
    opts=opts||{};
    if(!loaded||!fbIsReady)return Promise.resolve(false);
    if(applyingRemoteRef.current&&!opts.force)return Promise.resolve(false);
    var snapshot=opts.data!=null?opts.data:dataRef.current;
    saveLocal(snapshot);
    if(pushTimerRef.current){clearTimeout(pushTimerRef.current);pushTimerRef.current=null;}
    if(flushInProgressRef.current&&!opts.force)return Promise.resolve(false);
    flushInProgressRef.current=true;
    setSyncing(true);
    return fbPush(snapshot).then(function(ok){
      setSyncing(false);
      flushInProgressRef.current=false;
      if(ok){pendingRef.current=false;setLastSync(Date.now());}
      else if(opts.toastOnFail)notify("⚠️ Lỗi đồng bộ — thử lại");
      return ok;
    });
  }

  // Wait for Firebase SDK module to initialize (it loads async)
  React.useEffect(function(){
    if(fbIsReady)return;
    function onReady(){setFbIsReady(true);}
    window.addEventListener("fb-ready",onReady);
    // Fallback: poll for 5 seconds in case event missed
    var tries=0,iv=setInterval(function(){if(fbReady()){setFbIsReady(true);clearInterval(iv);}else if(++tries>50)clearInterval(iv);},100);
    return function(){window.removeEventListener("fb-ready",onReady);clearInterval(iv);};
  },[fbIsReady]);

  // Initial load: localStorage first (instant render), then subscribe to Firestore
  React.useEffect(function(){
    var local=loadLocal();
    setData(local);
    setLoaded(true);
  },[]);

  // Subscribe to Firestore once SDK is ready and we've loaded local data.
  // Realtime: any change on any device delivers here within ~300ms.
  React.useEffect(function(){
    if(!loaded||!fbIsReady)return;
    var unsub=fbSubscribe(function(cloud){
      var local=loadLocal();
      // First-ever subscribe: cloud may be empty → push our local up if we have any
      if((!cloud||cloud.length===0)&&local.length>0){fbPush(local);return;}
      var merged=smartMerge(cloud||[],local);
      // Avoid no-op rerenders + don't trigger our own push effect
      var stripD=function(arr){return arr.map(function(e){return Object.assign({},e,{files:(e.files||[]).map(function(f){return f?{name:f.name,type:f.type,driveId:f.driveId||null}:f;})});});};
      var hLocal=JSON.stringify(stripD(local));
      var hMerged=JSON.stringify(stripD(merged));
      if(hLocal!==hMerged){
        applyingRemoteRef.current=true;
        setData(merged);
        saveLocal(merged);
        notify("🔄 Đã cập nhật");
      }
      setLastSync(Date.now());
    });
    return unsub;
  },[loaded,fbIsReady]);

  // Push local changes up to Firestore — debounced 300ms. Skip if the data
  // change was caused by a remote update we just applied.
  React.useEffect(function(){
    if(!loaded||!fbIsReady)return;
    saveLocal(data);
    if(applyingRemoteRef.current){applyingRemoteRef.current=false;return;}
    pendingRef.current=true;
    if(pushTimerRef.current)clearTimeout(pushTimerRef.current);
    pushTimerRef.current=setTimeout(function(){pushNow();},300);
  },[data,loaded,fbIsReady]);

  // Flush pending writes when user leaves the tab (mobile: switch app / close Safari)
  React.useEffect(function(){
    if(!loaded||!fbIsReady)return;
    function onHide(){
      if(document.visibilityState==="hidden")pushNow({force:true});
    }
    function onPageHide(){pushNow({force:true});}
    document.addEventListener("visibilitychange",onHide);
    window.addEventListener("pagehide",onPageHide);
    return function(){
      document.removeEventListener("visibilitychange",onHide);
      window.removeEventListener("pagehide",onPageHide);
    };
  },[loaded,fbIsReady]);

  // Manage Blob URL for the file preview. data: URIs are blocked inside <iframe>
  // by Chrome/Safari (which is why PDF preview was showing as a blank page);
  // converting to a blob: URL fixes that, and we revoke when the preview closes.
  React.useEffect(function(){
    if(!preview||!preview.data){setPreviewURL(null);return;}
    var url=dataURItoBlobURL(preview.data);
    setPreviewURL(url);
    return function(){if(url&&url.indexOf("blob:")===0){try{URL.revokeObjectURL(url);}catch(e){}}};
  },[preview]);

  // Background Drive backup: any file that has bytes but no driveId gets uploaded
  // to the Drive folder. Runs whenever data changes (e.g. after saving an entry
  // with new attachments). Uses uploadingRef to dedupe concurrent uploads.
  React.useEffect(function(){
    if(!loaded||!SYNC_URL)return;
    data.forEach(function(e){
      (e.files||[]).forEach(function(f){
        if(!f||!fOK(f)||f.driveId)return;
        var key=e.id+"|"+f.name;
        if(uploadingRef.current[key])return;
        uploadingRef.current[key]=true;
        driveUpload(f.name,f.type,f.data).then(function(id){
          if(id){
            setData(function(prev){return prev.map(function(en){
              if(en.id!==e.id)return en;
              return Object.assign({},en,{files:(en.files||[]).map(function(ff){return ff&&ff.name===f.name&&!ff.driveId?Object.assign({},ff,{driveId:id}):ff;})});
            });});
          }
          delete uploadingRef.current[key];
        }).catch(function(){delete uploadingRef.current[key];});
      });
    });
  },[data,loaded]);

  // Brief green pulse on sync icon when a sync completes successfully
  React.useEffect(function(){
    if(!lastSync)return;
    setSyncPulse(true);
    var t=setTimeout(function(){setSyncPulse(false);},700);
    return function(){clearTimeout(t);};
  },[lastSync]);

  function doSync(){
    pushNow({force:true,toastOnFail:true}).then(function(ok){
      if(ok)notify("🔄 Đã đồng bộ");
    });
  }

  function notify(m){setToast(m);setTimeout(function(){setToast(null);},2500);}
  function uf(k,v){setForm(function(f){var n=Object.assign({},f);n[k]=v;if(k==="venue"){if(VN[v])n.travelMul=VN[v].x;if(VH[v]!==undefined)n.homeTeam=VH[v];}if(k==="competition")n.round="";return n;});}
  function validateForm(){if(!form.date){notify("⚠️ Chọn ngày");return false;}if(!form.venue){notify("⚠️ Chọn sân");return false;}if(form.venue==="Khác"&&!form.customVenue.trim()){notify("⚠️ Nhập tên sân");return false;}return true;}
  function commitSave(){
    var now=Date.now();
    if(eid){
      setData(function(p){
        var next=p.map(function(e){return e.id===eid?Object.assign({},form,{updatedAt:now}):e;});
        dataRef.current=next;
        return next;
      });
      notify("✅ Cập nhật");
    }else{
      setData(function(p){
        var next=p.concat([Object.assign({},form,{updatedAt:now})]);
        dataRef.current=next;
        return next;
      });
      notify("✅ Đã thêm");
    }
    setForm(mk());setEid(null);setTab("timeline");
    pushNow({force:true,toastOnFail:true});
  }
  function save(){if(!validateForm())return;if(saving||saved)return;setSaving(true);setTimeout(function(){setSaving(false);setSaved(true);setTimeout(function(){setSaved(false);commitSave();},420);},820);}
  // Animated bulk-mark for payment screens
  function mAllAnim(field,which){if(markAllAnim)return;setMarkAllAnim(which);setTimeout(function(){setMarkAllAnim(null);mAll(field);},900);}
  // Ripple effect helper for tap buttons (mark paid, etc.)
  function rippleClick(ev){var el=ev.currentTarget;el.classList.remove("rip");void el.offsetWidth;el.classList.add("rip");setTimeout(function(){if(el)el.classList.remove("rip");},600);}

  // Pay-t click: burst animation + toggle + show undo snackbar (Google Tasks-style)

  }
  function doUndo(){

    if(undoTimerRef.current){clearTimeout(undoTimerRef.current);undoTimerRef.current=null;}
    tp(undoData.id,undoData.field); // toggle back
    setUndoData(null);
    notify("↶ Đã hoàn tác");
  }
  function rm(id){setData(function(p){var next=p.filter(function(e){return e.id!==id;});dataRef.current=next;return next;});setDelId(null);notify("🗑️ Xoá");pushNow({force:true});}
  function ed(e){setForm(Object.assign({},e,{files:e.files||[]}));setEid(e.id);setTab("add");}
  function tp(id,f){setData(function(p){var next=p.map(function(e){if(e.id===id){var n=Object.assign({},e);n[f]=!n[f];n.updatedAt=Date.now();return n;}return e;});dataRef.current=next;return next;});pushNow({force:true});}
  function mAll(f){var ids={};fl().forEach(function(e){ids[e.id]=1;});var now=Date.now();setData(function(p){var next=p.map(function(e){if(ids[e.id]){var n=Object.assign({},e);n[f]=true;n.updatedAt=now;return n;}return e;});dataRef.current=next;return next;});notify("✅ Xong");pushNow({force:true});}

  var fl=React.useCallback(function(){
    var r=data.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    if(dFrom)r=r.filter(function(e){return e.date>=dFrom;});
    if(dTo)r=r.filter(function(e){return e.date<=dTo;});
    if(preset==="unpaid")r=r.filter(function(e){return !e.salaryPaid||!e.travelPaid;});
    if(search){var q=search.toLowerCase().trim();r=r.filter(function(e){return [e.homeTeam,e.awayTeam,e.venue,e.customVenue,e.competition,e.round,e.note].some(function(v){return v&&v.toLowerCase().indexOf(q)>-1;});});}
    return r;
  },[data,dFrom,dTo,preset,search]);
  var gs=React.useCallback(function(){var f=fl(),tS=0,pS=0,tT=0,pT=0;f.forEach(function(e){tS+=e.salary;if(e.salaryPaid)pS+=e.salary;tT+=tA(e);if(e.travelPaid)pT+=tA(e);});return{n:f.length,tS:tS,pS:pS,uS:tS-pS,tT:tT,pT:pT,uT:tT-pT,tot:tS+tT,pd:pS+pT,up:tS+tT-pS-pT};},[fl]);

  function addFiles(){if(fileRef.current)fileRef.current.click();}
  async function onFiles(ev){var fs=Array.from(ev.target.files||[]);if(!fs.length)return;var nf=[];for(var i=0;i<fs.length;i++){var d=await readF(fs[i]);if(fs[i].type.startsWith("image/"))d=await compress(d);nf.push({name:fs[i].name,type:fs[i].type,data:d});}setForm(function(f){return Object.assign({},f,{files:(f.files||[]).concat(nf)});});notify("📎 +"+nf.length);ev.target.value="";}
  function rmF(i){setForm(function(f){return Object.assign({},f,{files:f.files.filter(function(_,j){return j!==i;})});});}

  // Open preview: if file has valid bytes locally → show directly; otherwise if it
  // has a driveId → fetch from Drive, cache to localStorage, then show; otherwise
  // open with no data (the modal will render the "missing" warning).
  async function openPreview(f){
    if(fOK(f)){setPreview(f);return;}
    if(!f||!f.driveId){setPreview(f);return;}
    setFetchingFile(true);
    notify("☁ Đang tải từ Drive...");
    var got=await driveDownload(f.driveId);
    setFetchingFile(false);
    if(got&&got.data){
      var hydrated=Object.assign({},f,{data:got.data});
      setPreview(hydrated);
      // Cache the bytes back into localStorage so next time is instant
      setData(function(prev){return prev.map(function(en){
        var newFiles=(en.files||[]).map(function(ff){return ff&&ff.name===f.name&&ff.driveId===f.driveId?Object.assign({},ff,{data:got.data}):ff;});
        var changed=(en.files||[]).some(function(ff){return ff&&ff.name===f.name&&ff.driveId===f.driveId;});
        return changed?Object.assign({},en,{files:newFiles}):en;
      });});
    }else{
      setPreview(f);
      notify("❌ Không tải được từ Drive");
    }
  }

  // Calendar
  function calMap(){var map={};data.forEach(function(e){if(!e.date)return;var d=new Date(e.date);if(d.getFullYear()===calY&&d.getMonth()===calM){var k=d.getDate();if(!map[k])map[k]=[];map[k].push(e);}});return map;}
  function calPrev(){if(calM===0){setCalM(11);setCalY(calY-1);}else setCalM(calM-1);setCalSel(null);}
  function calNext(){if(calM===11){setCalM(0);setCalY(calY+1);}else setCalM(calM+1);setCalSel(null);}

  if(!loaded)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"var(--bg)"}}><div style={{width:40,height:40,border:"3px solid var(--bd)",borderTopColor:"var(--grn)",borderRadius:"50%",animation:"sp .7s linear infinite"}}/></div>;

  var s=gs(),list=fl(),cm=calMap();
  var dim=new Date(calY,calM+1,0).getDate();
  var fd0=(new Date(calY,calM,1).getDay()+6)%7;
  var isImg=function(f){return f&&f.type&&f.type.startsWith("image/");};
  var isPdf=function(f){return f&&f.type==="application/pdf";};
  var selE=calSel?data.filter(function(e){return nDate(e.date)===calSel;}):[];

  function applyPreset(p){
    setPreset(p);
    var t=new Date(),y=t.getFullYear(),m=t.getMonth();

                    </div>}
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {!e.salaryPaid&&<span style={{background:"rgba(66,165,245,.12)",color:"var(--blu)",border:"1px solid rgba(66,165,245,.3)",borderRadius:8,padding:"5px 10px",fontSize:12,fontWeight:700}}>💰 Lương: {vnd(e.salary)}</span>}
                      {!e.travelPaid&&<span style={{background:"rgba(255,152,0,.12)",color:"var(--amb)",border:"1px solid rgba(255,152,0,.3)",borderRadius:8,padding:"5px 10px",fontSize:12,fontWeight:700}}>🚗 CTP: {vnd(tA(e))}</span>}
                    </div>
                    {!e.travelPaid&&e.travelExtra>0&&<div style={{fontSize:11,color:"var(--t3)",marginTop:6,fontStyle:"italic"}}>= {vnd(e.travelBase)} × {e.travelMul} + {vnd(e.travelExtra)}{e.travelNote?" ("+e.travelNote+")":" phát sinh"}</div>}
                    {e.note&&<div style={{fontSize:12,color:"var(--t2)",marginTop:10,paddingTop:10,borderTop:"1px dashed var(--bd)",lineHeight:1.4}}>📝 {e.note}</div>}
                  </button>
                </div>;
              })}
            </div>
          </div>;
        })()}
      </div>}

      {/* STATS */}
      {tab==="chart"&&<div>
        <div className="sec-t">📊 Thống kê</div>
        {Filter}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
          {[{l:"Trận",v:s.n,c:"var(--grn)",raw:1},{l:"Thu nhập",v:s.tot,c:"var(--grn)"},{l:"Đã nhận",v:s.pd,c:"var(--grn2)"},{l:"Chưa nhận",v:s.up,c:"var(--amb)"}].map(function(x,i){return <div key={i} style={{background:"var(--c1)",borderRadius:16,padding:14,border:"1px solid var(--bd)",borderLeft:"4px solid "+x.c,minWidth:0}}><div style={{fontSize:10,color:"var(--t3)",textTransform:"uppercase",fontWeight:700,letterSpacing:.3}}>{x.l}</div><div style={{fontSize:x.raw?20:16,fontWeight:800,color:x.c,marginTop:6,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{x.raw?x.v:vnd(x.v)}</div></div>;})}
        </div>
        {list.length>0&&(function(){
          var grp={};list.forEach(function(e){var k=e.competition||"Khác";if(!grp[k])grp[k]={n:0,inc:0,rounds:{}};grp[k].n++;grp[k].inc+=e.salary+tA(e);var r=e.round||"(chưa rõ)";if(!grp[k].rounds[r])grp[k].rounds[r]=0;grp[k].rounds[r]++;});
          return <div className="crd"><div style={{fontSize:16,fontWeight:700,marginBottom:14}}>🏆 Theo giải & vòng đấu</div>
            {Object.keys(grp).map(function(k){var g=grp[k];return <div key={k} style={{marginBottom:14,paddingBottom:14,borderBottom:"1px solid var(--bd)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontWeight:800,fontSize:15}}>{k}</span>
                <span style={{fontSize:13,color:"var(--t2)"}}>{g.n} trận · <span style={{color:"var(--grn)",fontWeight:700}}>{vnd(g.inc)}</span></span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {Object.keys(g.rounds).sort(function(a,b){var na=parseInt((a.match(/\d+/)||[0])[0]),nb=parseInt((b.match(/\d+/)||[0])[0]);return na-nb;}).map(function(r){return <span key={r} style={{background:"var(--c2)",border:"1px solid var(--bd)",borderRadius:8,padding:"4px 10px",fontSize:12,color:"var(--t2)"}}>{r} <span style={{color:"var(--blu)",fontWeight:800}}>×{g.rounds[r]}</span></span>;})}
              </div>
            </div>;})}
          </div>;
        })()}
        {list.length>0&&(function(){
          // Aggregate co-workers across visible matches by role
          var byPerson={}; // name -> {n:total, roles:{TX,KTV,RO,LX}}
          list.forEach(function(e){
            [["TX",e.leader],["KTV",e.tech],["RO",e.ro],["LX",e.driver],["VPF",e.vpf]].forEach(function(r){
              var name=(r[1]||"").trim();if(!name)return;
              if(!byPerson[name])byPerson[name]={n:0,roles:{TX:0,KTV:0,RO:0,LX:0,VPF:0}};
              byPerson[name].n++;byPerson[name].roles[r[0]]++;
            });
          });
          var people=Object.keys(byPerson);
          if(people.length===0)return null;
          people.sort(function(a,b){return byPerson[b].n-byPerson[a].n;});
          var roleColor={TX:"#42A5F5",KTV:"#AB47BC",RO:"#26A69A",LX:"#FF7043",VPF:"#7E57C2"};
          return <div className="crd"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontSize:16,fontWeight:700}}>👥 Đồng đội ({people.length})</div>
              <div style={{fontSize:12,color:"var(--t3)"}}>Số trận đi cùng</div>
            </div>
            {people.map(function(name){var p=byPerson[name];return <div key={name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid var(--bd)",gap:8}}>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{name}</div>
                <div style={{display:"flex",gap:4,marginTop:4,flexWrap:"wrap"}}>{["TX","KTV","RO","LX","VPF"].filter(function(r){return p.roles[r]>0;}).map(function(r){return <span key={r} style={{fontSize:10,padding:"1px 6px",borderRadius:4,background:roleColor[r]+"22",color:roleColor[r],fontWeight:700}}>{r} ×{p.roles[r]}</span>;})}</div>
              </div>
              <div style={{fontSize:18,fontWeight:800,color:"var(--blu)",flexShrink:0}}>{p.n}</div>
            </div>;})}
          </div>;
        })()}
        {list.some(function(e){return e.files&&e.files.length>0;})&&<div className="crd">
          <div style={{fontSize:16,fontWeight:700,marginBottom:14}}>📁 File — Tải về</div>
          {list.filter(function(e){return e.files&&e.files.length>0;}).map(function(e){return <button key={e.id} onClick={function(){setFModal(e);}} style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",background:"var(--c2)",border:"1px solid var(--bd)",borderRadius:14,padding:"14px 16px",marginBottom:8,cursor:"pointer",textAlign:"left",fontFamily:"inherit",color:"var(--t1)"}}><div><div style={{fontWeight:700,fontSize:14}}>{fd(e.date)}{e.round?" · "+e.round:""}</div><div style={{fontSize:13,color:"var(--t3)"}}>{e.homeTeam||"—"} vs {e.awayTeam||"—"}</div></div><span style={{color:"var(--blu)",fontWeight:800}}>📎{e.files.length}</span></button>;})}
        </div>}
      </div>}
    </main>
    {(tab==="home"||tab==="timeline")&&<button className="fab" aria-label="Thêm trận mới" onClick={function(){setTab("add");setForm(mk());setEid(null);}}>➕</button>}
  </div>;
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
