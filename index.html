<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#121212;--c1:#1E1E1E;--c2:#252525;--bd:#2E2E2E;--t1:rgba(255,255,255,.87);--t2:rgba(255,255,255,.6);--t3:rgba(255,255,255,.38);--grn:#4CAF50;--grn2:#2E7D32;--amb:#FF9800;--red:#F44336;--blu:#42A5F5}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;-webkit-tap-highlight-color:transparent}

<script type="text/babel">
// ============================================================
// CẤU HÌNH: Dán URL Google Apps Script vào đây
// ============================================================
var SYNC_URL = "https://script.google.com/macros/s/AKfycbwSE772NYibPpjceErmLdBHX7X-Y2ZvqGvBpXaNxZsPATP_s1DiwIVAVcO05X6wHnd7AA/exec";
// ============================================================

var STORE="var-tracker-v5";
var VN={"Hàng Đẫy":{x:1},"Mỹ Đình":{x:1},"Hải Phòng":{x:1},"Thanh Hoá":{x:1},"Ninh Bình":{x:1},"Nam Định":{x:1},"VPF Hưng Yên":{x:1},"Vinh":{x:1.5},"Hà Tĩnh":{x:2},"Khác":{x:1}};
// Stadium identity: abbreviation + color for timeline markers
var VS={"Hàng Đẫy":{a:"HĐ",c:"#7B1FA2"},"Mỹ Đình":{a:"MĐ",c:"#C62828"},"Hải Phòng":{a:"HP",c:"#BF360C"},"Thanh Hoá":{a:"TH",c:"#E65100"},"Ninh Bình":{a:"NB",c:"#2E7D32"},"Nam Định":{a:"NĐ",c:"#558B2F"},"VPF Hưng Yên":{a:"VPF",c:"#01579B"},"Vinh":{a:"VINH",c:"#4E342E"},"Hà Tĩnh":{a:"HT",c:"#880E4F"},"Khác":{a:"?",c:"#455A64"}};
// Default home team per venue
var VH={"Hàng Đẫy":"Hà Nội FC","Mỹ Đình":"","Hải Phòng":"CLB Hải Phòng","Thanh Hoá":"Đông Á Thanh Hoá","Ninh Bình":"Phù Đổng Ninh Bình","Nam Định":"Thép Xanh Nam Định","VPF Hưng Yên":"PVF CAND","Vinh":"SLNA","Hà Tĩnh":"Hồng Lĩnh Hà Tĩnh","Khác":""};
var COMPS=["V.League 1","Cúp Quốc Gia","V.League 2","Giải Hạng Nhì","Siêu Cúp","Khác"];
var CUP_ROUNDS=["Vòng loại","Vòng 1/16","Vòng 1/8","Tứ kết","Bán kết","Chung kết"];
function getRounds(comp){
  if(comp==="Cúp Quốc Gia")return [""].concat(CUP_ROUNDS);
  if(comp==="Siêu Cúp")return ["","Trận Siêu Cúp"];
  if(comp==="Khác")return null; // free text
  var r=[""];for(var i=1;i<=20;i++)r.push("Vòng "+i);return r;
}
var MN=["Tháng 1","Tháng 2","Tháng 3","Tháng 4","Tháng 5","Tháng 6","Tháng 7","Tháng 8","Tháng 9","Tháng 10","Tháng 11","Tháng 12"];
var DW=["T2","T3","T4","T5","T6","T7","CN"];

function vnd(n){return new Intl.NumberFormat("vi-VN").format(n)+"đ";}
function fmM(n){return n?new Intl.NumberFormat("vi-VN").format(n):"";}
function fd(s){if(!s)return"";var d=new Date(s),w=["CN","T2","T3","T4","T5","T6","T7"];return w[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
function mk(){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:"",time:"",venue:"",customVenue:"",homeTeam:"",awayTeam:"",competition:"V.League 1",round:"",salary:2500000,travelMul:1,travelBase:300000,travelExtra:0,travelNote:"",salaryPaid:false,travelPaid:false,note:"",files:[],updatedAt:Date.now()};}
function tA(e){return e.travelBase*e.travelMul+(e.travelExtra||0);}
function compress(url,mx){mx=mx||1200;return new Promise(function(r){var i=new Image();i.onload=function(){var c=document.createElement("canvas"),s=i.width>mx?mx/i.width:1;c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7));};i.onerror=function(){r(url);};i.src=url;});}
function readF(f){return new Promise(function(r,j){var x=new FileReader();x.onload=function(){r(x.result);};x.onerror=j;x.readAsDataURL(f);});}
function dlFile(u,n){var a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);}

// Local storage
function loadLocal(){try{var d=localStorage.getItem(STORE);return d?JSON.parse(d):[];}catch(e){return[];}}
function saveLocal(data){try{localStorage.setItem(STORE,JSON.stringify(data));}catch(e){}}

// Google Sheets sync
async function syncPull(){
  if(!SYNC_URL)return null;
  try{var r=await fetch(SYNC_URL+"?action=get");var j=await r.json();if(j.ok&&j.data)return j.data;return null;}catch(e){console.warn("Pull fail:",e);return null;}
}
async function syncPush(data){
  if(!SYNC_URL)return false;
  try{
    // Don't push file data to sheets (too large)
    var clean=data.map(function(e){return Object.assign({},e,{files:[]});});
    await fetch(SYNC_URL+"?action=save",{method:"POST",body:JSON.stringify(clean),headers:{"Content-Type":"text/plain"}});
    return true;
  }catch(e){console.warn("Push fail:",e);return false;}
}
function fmtTime(t){if(!t)return"";var d=new Date(t),now=new Date(),diff=(now-d)/1000;if(diff<60)return"vừa xong";if(diff<3600)return Math.floor(diff/60)+"p trước";if(diff<86400)return Math.floor(diff/3600)+"h trước";return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

// Merge cloud + local: prefer entry with newer updatedAt to avoid losing
// recent local edits when cloud hasn't been pushed yet.
function smartMerge(cloud,local){
  var byId={};
  cloud.forEach(function(c){byId[c.id]=c;});
  local.forEach(function(l){
    var c=byId[l.id];
    if(!c){byId[l.id]=l;return;}
    var lu=l.updatedAt||0,cu=c.updatedAt||0;
    // Pick newer; always preserve files from local (cloud doesn't store files)
    var winner=lu>cu?l:c;
    byId[l.id]=Object.assign({},winner,{files:l.files||[]});
  });
  return Object.keys(byId).map(function(k){return byId[k];});
}

function App(){
  var[data,setData]=React.useState([]);
  var[tab,setTab]=React.useState("timeline");
  var[eid,setEid]=React.useState(null);
  var[form,setForm]=React.useState(mk());
  var[dFrom,setDFrom]=React.useState("");
  var[dTo,setDTo]=React.useState("");
  var[preset,setPreset]=React.useState("");
  var[search,setSearch]=React.useState("");
  var[showPaid,setShowPaid]=React.useState(false);
  var[sType,setSType]=React.useState("travel");
  var[loaded,setLoaded]=React.useState(false);
  var[delId,setDelId]=React.useState(null);
  var[toast,setToast]=React.useState(null);
  var[syncing,setSyncing]=React.useState(false);
  var[lastSync,setLastSync]=React.useState(null);
  var pushTimerRef=React.useRef(null);
  var pendingRef=React.useRef(false);
  var[preview,setPreview]=React.useState(null);
  var[fModal,setFModal]=React.useState(null);
  var now=new Date();
  var[calY,setCalY]=React.useState(now.getFullYear());
  var[calM,setCalM]=React.useState(now.getMonth());
  var[calSel,setCalSel]=React.useState(null);
  var aiRef=React.useRef(null);
  var fileRef=React.useRef(null);

  // Load: local first, then pull from cloud
  React.useEffect(function(){
    var local=loadLocal();
    setData(local);
    setLoaded(true);
    syncPull().then(function(cloud){
      if(cloud&&cloud.length>0){
        var merged=smartMerge(cloud,local);
        setData(merged);
        saveLocal(merged);
        setLastSync(Date.now());
      }
    });
  },[]);

  // Save on change: local instant, cloud debounced (1.5s) to avoid lag
  React.useEffect(function(){
    if(!loaded)return;
    saveLocal(data);
    if(!SYNC_URL)return;
    pendingRef.current=true;
    if(pushTimerRef.current)clearTimeout(pushTimerRef.current);
    pushTimerRef.current=setTimeout(function(){
      setSyncing(true);
      syncPush(data).then(function(ok){
        setSyncing(false);
        if(ok){pendingRef.current=false;setLastSync(Date.now());}
      });
    },1500);
  },[data,loaded]);

  // Pull on visibility change (when user switches back to app)
  React.useEffect(function(){
    function onVis(){
      if(document.visibilityState!=="visible"||!loaded||pendingRef.current)return;
      syncPull().then(function(cloud){
        if(!cloud||cloud.length===0)return;
        var local=loadLocal();
        var merged=smartMerge(cloud,local);
        var aHash=JSON.stringify(merged.map(function(e){return Object.assign({},e,{files:[]});}));
        var bHash=JSON.stringify(local.map(function(e){return Object.assign({},e,{files:[]});}));
        if(aHash!==bHash){setData(merged);saveLocal(merged);setLastSync(Date.now());notify("🔄 Đã cập nhật từ thiết bị khác");}
      });
    }
    document.addEventListener("visibilitychange",onVis);
    window.addEventListener("focus",onVis);
    return function(){document.removeEventListener("visibilitychange",onVis);window.removeEventListener("focus",onVis);};
  },[loaded]);

  function doSync(){
    setSyncing(true);
    syncPull().then(function(cloud){
      if(cloud){
        var local=loadLocal();
        var merged=smartMerge(cloud,local);
        setData(merged);saveLocal(merged);
      }
      setSyncing(false);setLastSync(Date.now());notify("🔄 Đã đồng bộ");
    }).catch(function(){setSyncing(false);});
  }

  function notify(m){setToast(m);setTimeout(function(){setToast(null);},2500);}
  function uf(k,v){setForm(function(f){var n=Object.assign({},f);n[k]=v;if(k==="venue"){if(VN[v])n.travelMul=VN[v].x;if(VH[v]!==undefined)n.homeTeam=VH[v];}if(k==="competition")n.round="";return n;});}
  function save(){if(!form.date){notify("⚠️ Chọn ngày");return;}if(!form.venue){notify("⚠️ Chọn sân");return;}if(form.venue==="Khác"&&!form.customVenue.trim()){notify("⚠️ Nhập tên sân");return;}var now=Date.now();if(eid){setData(function(p){return p.map(function(e){return e.id===eid?Object.assign({},form,{updatedAt:now}):e;});});notify("✅ Cập nhật");}else{setData(function(p){return p.concat([Object.assign({},form,{updatedAt:now})]);});notify("✅ Đã thêm");}setForm(mk());setEid(null);setTab("timeline");}
  function rm(id){setData(function(p){return p.filter(function(e){return e.id!==id;});});setDelId(null);notify("🗑️ Xoá");}
  function ed(e){setForm(Object.assign({},e,{files:e.files||[]}));setEid(e.id);setTab("add");}
  function tp(id,f){setData(function(p){return p.map(function(e){if(e.id===id){var n=Object.assign({},e);n[f]=!n[f];n.updatedAt=Date.now();return n;}return e;});});}
  function mAll(f){var ids={};fl().forEach(function(e){ids[e.id]=1;});var now=Date.now();setData(function(p){return p.map(function(e){if(ids[e.id]){var n=Object.assign({},e);n[f]=true;n.updatedAt=now;return n;}return e;});});notify("✅ Xong");}

  var fl=React.useCallback(function(){
    var r=data.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    if(dFrom)r=r.filter(function(e){return e.date>=dFrom;});
    if(dTo)r=r.filter(function(e){return e.date<=dTo;});
    if(preset==="unpaid")r=r.filter(function(e){return !e.salaryPaid||!e.travelPaid;});
    if(search){var q=search.toLowerCase().trim();r=r.filter(function(e){return [e.homeTeam,e.awayTeam,e.venue,e.customVenue,e.competition,e.round,e.note].some(function(v){return v&&v.toLowerCase().indexOf(q)>-1;});});}
    return r;
  },[data,dFrom,dTo,preset,search]);
  var gs=React.useCallback(function(){var f=fl(),tS=0,pS=0,tT=0,pT=0;f.forEach(function(e){tS+=e.salary;if(e.salaryPaid)pS+=e.salary;tT+=tA(e);if(e.travelPaid)pT+=tA(e);});return{n:f.length,tS:tS,pS:pS,uS:tS-pS,tT:tT,pT:pT,uT:tT-pT,tot:tS+tT,pd:pS+pT,up:tS+tT-pS-pT};},[fl]);

  function addFiles(){if(fileRef.current)fileRef.current.click();}
  async function onFiles(ev){var fs=Array.from(ev.target.files||[]);if(!fs.length)return;var nf=[];for(var i=0;i<fs.length;i++){var d=await readF(fs[i]);if(fs[i].type.startsWith("image/"))d=await compress(d);nf.push({name:fs[i].name,type:fs[i].type,data:d});}setForm(function(f){return Object.assign({},f,{files:(f.files||[]).concat(nf)});});notify("📎 +"+nf.length);ev.target.value="";}
  function rmF(i){setForm(function(f){return Object.assign({},f,{files:f.files.filter(function(_,j){return j!==i;})});});}

  // Calendar
  function calMap(){var map={};data.forEach(function(e){if(!e.date)return;var d=new Date(e.date);if(d.getFullYear()===calY&&d.getMonth()===calM){var k=d.getDate();if(!map[k])map[k]=[];map[k].push(e);}});return map;}
  function calPrev(){if(calM===0){setCalM(11);setCalY(calY-1);}else setCalM(calM-1);setCalSel(null);}
  function calNext(){if(calM===11){setCalM(0);setCalY(calY+1);}else setCalM(calM+1);setCalSel(null);}

  if(!loaded)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#121212"}}><div style={{width:40,height:40,border:"3px solid #333",borderTopColor:"#4CAF50",borderRadius:"50%",animation:"sp .7s linear infinite"}}/></div>;

  var s=gs(),list=fl(),cm=calMap();
  var dim=new Date(calY,calM+1,0).getDate();
  var fd0=(new Date(calY,calM,1).getDay()+6)%7;
  var isImg=function(f){return f&&f.type&&f.type.startsWith("image/");};
  var isPdf=function(f){return f&&f.type==="application/pdf";};
  var selE=calSel?data.filter(function(e){return e.date===calSel;}):[];

  function applyPreset(p){
    setPreset(p);
    var t=new Date(),y=t.getFullYear(),m=t.getMonth();
    var pad=function(n){return String(n).padStart(2,"0");};
    var ymd=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
    if(p==="thismonth"){setDFrom(ymd(new Date(y,m,1)));setDTo(ymd(new Date(y,m+1,0)));}
    else if(p==="lastmonth"){setDFrom(ymd(new Date(y,m-1,1)));setDTo(ymd(new Date(y,m,0)));}
    else if(p==="next7"){setDFrom(ymd(t));setDTo(ymd(new Date(t.getTime()+7*86400000)));}
    else if(p==="all"){setDFrom("");setDTo("");}
    else if(p==="unpaid"){setDFrom("");setDTo("");}
  }
  var presetBtns=[{id:"thismonth",lb:"Tháng này"},{id:"lastmonth",lb:"Tháng trước"},{id:"next7",lb:"7 ngày tới"},{id:"unpaid",lb:"Chưa thu"},{id:"all",lb:"Tất cả"}];

  var Filter=<div style={{marginBottom:14}}>
    <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8,marginBottom:8,WebkitOverflowScrolling:"touch"}}>

        <div className="g2"><div><div className="fl">Hệ số</div><input type="number" step="0.5" value={form.travelMul} onChange={function(e){uf("travelMul",+e.target.value);}} className="fi"/></div><div><div className="fl">= CTP</div><div style={{background:"rgba(76,175,80,.1)",border:"1.5px solid rgba(76,175,80,.25)",borderRadius:14,padding:"14px 16px",color:"var(--grn)",fontSize:17,fontWeight:800}}>{vnd(form.travelBase*form.travelMul)}</div></div></div>
        <div className="g2"><div><div className="fl">Phát sinh</div><input type="text" inputMode="numeric" value={fmM(form.travelExtra)} onChange={function(e){var v=e.target.value.replace(/[^\d]/g,"");uf("travelExtra",v?+v:0);}} className="fi" placeholder="0"/></div><div><div className="fl">Ghi chú</div><input type="text" value={form.travelNote} onChange={function(e){uf("travelNote",e.target.value);}} className="fi" placeholder="Xăng..."/></div></div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(76,175,80,.08)",borderRadius:16,padding:"16px 20px",marginBottom:16,border:"1px solid rgba(76,175,80,.2)"}}><span>Tổng</span><span style={{fontSize:20,fontWeight:800,color:"var(--grn)"}}>{vnd(form.salary+form.travelBase*form.travelMul+(form.travelExtra||0))}</span></div>
        <div style={{marginBottom:16}}><div className="fl">Ghi chú</div><textarea value={form.note} onChange={function(e){uf("note",e.target.value);}} className="fi" style={{minHeight:56}} placeholder="..."/></div>

        <div style={{height:1,background:"var(--bd)",margin:"20px 0"}}/>
        <div style={{fontSize:16,fontWeight:800,marginBottom:10}}>📎 File</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
          {(form.files||[]).map(function(f,i){return <div key={i} style={{position:"relative",width:76,height:76,borderRadius:12,overflow:"hidden",border:"1px solid var(--bd)",background:"var(--c2)"}}>
            {isImg(f)?<img src={f.data} alt="" style={{width:"100%",height:"100%",objectFit:"cover",cursor:"pointer"}} onClick={function(){setPreview(f);}}/>:<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:28}} onClick={function(){setPreview(f);}}>📄</div>}
            <button onClick={function(){rmF(i);}} style={{position:"absolute",top:2,right:2,width:20,height:20,borderRadius:"50%",background:"rgba(244,67,54,.85)",border:"none",color:"#fff",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>;})}
          <button onClick={addFiles} style={{width:76,height:76,borderRadius:12,border:"1.5px dashed var(--bd)",background:"transparent",color:"var(--t3)",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,fontFamily:"inherit",fontSize:11}}>📎<span>Thêm</span></button>
        </div>
        <div style={{display:"flex",gap:10}}><button className="btn-m" style={{flex:1}} onClick={save}>✅ {eid?"Cập nhật":"Lưu"}</button><button className="btn-s" style={{flex:1}} onClick={function(){setTab("timeline");setEid(null);setForm(mk());}}>Huỷ</button></div>
      </div>}

      {/* PAY */}
      {tab==="pay"&&<div>
        <div className="sec-t">💰 Thanh toán</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0,marginBottom:16,background:"var(--c1)",borderRadius:14,padding:4,border:"1px solid var(--bd)"}}>
          {["travel","salary"].map(function(t){return <button key={t} onClick={function(){setSType(t);}} style={{padding:14,border:"none",borderRadius:11,background:sType===t?"var(--grn2)":"transparent",color:sType===t?"#fff":"var(--t3)",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{t==="travel"?"Công tác phí":"Lương VAR"}</button>;})}
        </div>
        {Filter}
        {list.length>0&&<div className="crd">
          {(sType==="travel"?[["Tổng CTP",s.tT,""],["Đã nhận",s.pT,"var(--grn)"],["Chưa nhận",s.uT,"var(--amb)"]]:[["Tổng lương",s.tS,""],["Đã nhận",s.pS,"var(--grn)"],["Chưa nhận",s.uS,"var(--amb)"]]).map(function(r,i){return <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",fontSize:15,color:r[2]||"var(--t1)"}}><span>{r[0]}</span><span style={{fontWeight:700}}>{vnd(r[1])}</span></div>;})}
          <button className="btn-m" style={{marginTop:14}} onClick={function(){mAll(sType==="travel"?"travelPaid":"salaryPaid");}}>✅ Đánh dấu tất cả</button>
        </div>}
        {(function(){
          var fld=sType==="travel"?"travelPaid":"salaryPaid";
          var sorted=list.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
          var unpaidL=sorted.filter(function(e){return !e[fld];});
          var paidL=sorted.filter(function(e){return e[fld];});
          var renderRow=function(e){var pd=e[fld],amt=sType==="travel"?tA(e):e.salary;return <div key={e.id} style={{display:"flex",alignItems:"center",gap:12,background:"var(--c1)",borderRadius:16,padding:"14px 16px",border:"1px solid var(--bd)",opacity:pd?.5:1}}>
            <button onClick={function(){tp(e.id,fld);}} aria-label={pd?"Bỏ đánh dấu":"Đánh dấu đã nhận"} style={{width:34,height:34,borderRadius:10,border:"2px solid "+(pd?"var(--grn)":"var(--bd)"),background:pd?"var(--grn)":"var(--c2)",color:pd?"#fff":"var(--t3)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:16,flexShrink:0,fontFamily:"inherit"}}>{pd?"✅":"○"}</button>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,color:"var(--t3)"}}>{fd(e.date)}{e.competition?" · "+e.competition:""}{e.round?" · "+e.round:""}</div><div style={{fontSize:15,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>📍 {e.venue==="Khác"?(e.customVenue||"—"):(e.venue||"—")}</div></div>
            <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:17,fontWeight:800,color:pd?"var(--grn)":"var(--t1)"}}>{vnd(amt)}</div><div style={{fontSize:12,fontWeight:700,color:pd?"var(--grn)":"var(--amb)"}}>{pd?"Đã nhận":"Chưa"}</div></div>
          </div>;};
          return <div>
            {unpaidL.length>0&&<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
              <div style={{fontSize:11,color:"var(--amb)",fontWeight:800,letterSpacing:.5,padding:"0 4px"}}>CHƯA NHẬN ({unpaidL.length})</div>
              {unpaidL.map(renderRow)}
            </div>}
            {paidL.length>0&&<div>
              <button onClick={function(){setShowPaid(!showPaid);}} style={{width:"100%",background:"var(--c2)",border:"1px dashed var(--bd)",borderRadius:12,padding:"10px 14px",color:"var(--t2)",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:showPaid?8:0}}>
                <span>✅ Đã nhận ({paidL.length})</span>
                <span style={{fontSize:11,color:"var(--t3)"}}>{showPaid?"▲ Ẩn":"▼ Hiện"}</span>
              </button>
              {showPaid&&<div style={{display:"flex",flexDirection:"column",gap:8}}>{paidL.map(renderRow)}</div>}
            </div>}
            {unpaidL.length===0&&paidL.length===0&&<div style={{textAlign:"center",padding:"40px 20px",color:"var(--t3)"}}>Không có trận nào</div>}
          </div>;
        })()}
      </div>}

      {/* TIMELINE - chỉ hiện trận chưa thu đủ */}
      {tab==="timeline"&&<div>
        <div className="sec-t">⏰ Trận cần thu tiền</div>
        {(function(){
          var unpaid=data.filter(function(e){return !e.salaryPaid||!e.travelPaid;});
          unpaid.sort(function(a,b){return (a.date||"").localeCompare(b.date||"");});
          if(unpaid.length===0)return <div className="crd" style={{textAlign:"center",padding:"40px 20px"}}>
            <div style={{fontSize:54,marginBottom:10}}>🎉</div>
            <div style={{fontSize:17,fontWeight:800,marginBottom:6}}>Đã thu đủ tất cả!</div>
            <div style={{fontSize:13,color:"var(--t3)"}}>Không còn trận nào đợi thanh toán.</div>
          </div>;
          var totSal=unpaid.reduce(function(s,e){return s+(!e.salaryPaid?e.salary:0);},0);
          var totTrv=unpaid.reduce(function(s,e){return s+(!e.travelPaid?tA(e):0);},0);
          return <div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:18}}>
              <div className="crd" style={{textAlign:"center",margin:0,padding:14,borderLeft:"3px solid var(--red)"}}>
                <div style={{fontSize:10,color:"var(--t3)",fontWeight:700,letterSpacing:.5}}>SỐ TRẬN</div>
                <div style={{fontSize:20,fontWeight:800,color:"var(--red)",marginTop:4}}>{unpaid.length}</div>
              </div>
              <div className="crd" style={{textAlign:"center",margin:0,padding:14,borderLeft:"3px solid var(--blu)"}}>
                <div style={{fontSize:10,color:"var(--t3)",fontWeight:700,letterSpacing:.5}}>LƯƠNG VAR</div>
                <div style={{fontSize:14,fontWeight:800,color:"var(--blu)",marginTop:4,whiteSpace:"nowrap"}}>{vnd(totSal)}</div>
              </div>
              <div className="crd" style={{textAlign:"center",margin:0,padding:14,borderLeft:"3px solid var(--amb)"}}>
                <div style={{fontSize:10,color:"var(--t3)",fontWeight:700,letterSpacing:.5}}>CTP</div>
                <div style={{fontSize:14,fontWeight:800,color:"var(--amb)",marginTop:4,whiteSpace:"nowrap"}}>{vnd(totTrv)}</div>
              </div>
            </div>
            <div style={{position:"relative",paddingLeft:56}}>
              {/* Wavy connecting line */}
              <svg style={{position:"absolute",left:8,top:18,width:40,height:"calc(100% - 36px)",zIndex:0,overflow:"visible"}} preserveAspectRatio="none" viewBox={"0 0 40 "+(unpaid.length*150)}>
                <path d={(function(){var p="M 20 0";for(var i=0;i<unpaid.length;i++){var y1=i*150+75,y2=i*150+150,cx=i%2===0?38:2;p+=" Q "+cx+" "+y1+" 20 "+y2;}return p;})()} stroke="url(#tlGrad)" strokeWidth="2.5" fill="none" strokeDasharray="5,5"/>
                <defs>
                  <linearGradient id="tlGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#F44336" stopOpacity=".8"/>
                    <stop offset="100%" stopColor="#FF9800" stopOpacity=".5"/>
                  </linearGradient>
                </defs>
              </svg>
              {unpaid.map(function(e,i){
                var both=!e.salaryPaid&&!e.travelPaid;
                var clr=both?"var(--red)":!e.salaryPaid?"var(--blu)":"var(--amb)";
                var vName=e.venue==="Khác"?e.customVenue:e.venue;
                var vs=VS[e.venue]||{a:(e.customVenue||"?").substring(0,3).toUpperCase(),c:"#455A64"};
                var fs=vs.a.length>=4?10:vs.a.length===3?12:15;
                var teams=(e.homeTeam||e.awayTeam)?(e.homeTeam||"?")+" vs "+(e.awayTeam||"?"):"";
                return <div key={e.id} style={{position:"relative",marginBottom:18,zIndex:1}}>
                  <div style={{position:"absolute",left:-50,top:18,width:40,height:40,borderRadius:"50%",background:vs.c,border:"3px solid "+clr,display:"flex",alignItems:"center",justifyContent:"center",fontSize:fs,fontWeight:800,color:"#fff",letterSpacing:.3,zIndex:2,boxShadow:"0 4px 12px rgba(0,0,0,.4)"}}>{vs.a}</div>
                  <button onClick={function(){ed(e);}} className="crd" style={{margin:0,width:"100%",textAlign:"left",cursor:"pointer",borderLeft:"4px solid "+clr,fontFamily:"inherit",color:"var(--t1)",padding:"14px 16px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8,gap:8,flexWrap:"wrap"}}>
                      <div style={{flex:"1 1 auto",minWidth:0}}>
                        <div style={{fontSize:11,color:"var(--t3)",fontWeight:700,letterSpacing:.3,textTransform:"uppercase"}}>{fd(e.date)}</div>
                        <div style={{fontSize:15,fontWeight:800,marginTop:3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>📍 {vName||"—"}</div>
                      </div>
                      {(e.competition||e.round)&&<div style={{display:"flex",flexDirection:"column",gap:4,alignItems:"flex-end",flexShrink:0}}>
                        {e.competition&&<span style={{background:"rgba(76,175,80,.15)",color:"var(--grn)",borderRadius:8,padding:"3px 10px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>🏆 {e.competition}</span>}
                        {e.round&&<span style={{background:"rgba(66,165,245,.15)",color:"var(--blu)",borderRadius:8,padding:"3px 10px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{e.round}</span>}
                      </div>}
                    </div>
                    {teams&&<div style={{fontSize:13,color:"var(--t2)",marginBottom:10}}>⚽ {teams}</div>}
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {!e.salaryPaid&&<span style={{background:"rgba(66,165,245,.12)",color:"var(--blu)",border:"1px solid rgba(66,165,245,.3)",borderRadius:8,padding:"5px 10px",fontSize:12,fontWeight:700}}>💰 Lương: {vnd(e.salary)}</span>}
                      {!e.travelPaid&&<span style={{background:"rgba(255,152,0,.12)",color:"var(--amb)",border:"1px solid rgba(255,152,0,.3)",borderRadius:8,padding:"5px 10px",fontSize:12,fontWeight:700}}>🚗 CTP: {vnd(tA(e))}</span>}
                    </div>
                    {!e.travelPaid&&e.travelExtra>0&&<div style={{fontSize:11,color:"var(--t3)",marginTop:6,fontStyle:"italic"}}>= {vnd(e.travelBase)} × {e.travelMul} + {vnd(e.travelExtra)}{e.travelNote?" ("+e.travelNote+")":" phát sinh"}</div>}
                    {e.note&&<div style={{fontSize:12,color:"var(--t2)",marginTop:10,paddingTop:10,borderTop:"1px dashed var(--bd)",lineHeight:1.4}}>📝 {e.note}</div>}
                  </button>
                </div>;
              })}
            </div>
          </div>;
        })()}
      </div>}

      {/* STATS */}
      {tab==="chart"&&<div>
        <div className="sec-t">📊 Thống kê</div>
        {Filter}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
          {[{l:"Trận",v:s.n,c:"var(--grn)",raw:1},{l:"Thu nhập",v:s.tot,c:"var(--grn)"},{l:"Đã nhận",v:s.pd,c:"var(--grn2)"},{l:"Chưa nhận",v:s.up,c:"var(--amb)"}].map(function(x,i){return <div key={i} style={{background:"var(--c1)",borderRadius:16,padding:18,border:"1px solid var(--bd)",borderLeft:"4px solid "+x.c}}><div style={{fontSize:11,color:"var(--t3)",textTransform:"uppercase",fontWeight:700}}>{x.l}</div><div style={{fontSize:22,fontWeight:800,color:x.c,marginTop:6}}>{x.raw?x.v:vnd(x.v)}</div></div>;})}
        </div>
        {list.length>0&&(function(){
          var grp={};list.forEach(function(e){var k=e.competition||"Khác";if(!grp[k])grp[k]={n:0,inc:0,rounds:{}};grp[k].n++;grp[k].inc+=e.salary+tA(e);var r=e.round||"(chưa rõ)";if(!grp[k].rounds[r])grp[k].rounds[r]=0;grp[k].rounds[r]++;});
          return <div className="crd"><div style={{fontSize:16,fontWeight:700,marginBottom:14}}>🏆 Theo giải & vòng đấu</div>
            {Object.keys(grp).map(function(k){var g=grp[k];return <div key={k} style={{marginBottom:14,paddingBottom:14,borderBottom:"1px solid var(--bd)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontWeight:800,fontSize:15}}>{k}</span>
                <span style={{fontSize:13,color:"var(--t2)"}}>{g.n} trận · <span style={{color:"var(--grn)",fontWeight:700}}>{vnd(g.inc)}</span></span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {Object.keys(g.rounds).sort(function(a,b){var na=parseInt((a.match(/\d+/)||[0])[0]),nb=parseInt((b.match(/\d+/)||[0])[0]);return na-nb;}).map(function(r){return <span key={r} style={{background:"var(--c2)",border:"1px solid var(--bd)",borderRadius:8,padding:"4px 10px",fontSize:12,color:"var(--t2)"}}>{r} <span style={{color:"var(--blu)",fontWeight:800}}>×{g.rounds[r]}</span></span>;})}
              </div>
            </div>;})}
          </div>;
        })()}
        {list.some(function(e){return e.files&&e.files.length>0;})&&<div className="crd">
          <div style={{fontSize:16,fontWeight:700,marginBottom:14}}>📁 File — Tải về</div>
          {list.filter(function(e){return e.files&&e.files.length>0;}).map(function(e){return <button key={e.id} onClick={function(){setFModal(e);}} style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",background:"var(--c2)",border:"1px solid var(--bd)",borderRadius:14,padding:"14px 16px",marginBottom:8,cursor:"pointer",textAlign:"left",fontFamily:"inherit",color:"var(--t1)"}}><div><div style={{fontWeight:700,fontSize:14}}>{fd(e.date)}{e.round?" · "+e.round:""}</div><div style={{fontSize:13,color:"var(--t3)"}}>{e.homeTeam||"—"} vs {e.awayTeam||"—"}</div></div><span style={{color:"var(--blu)",fontWeight:800}}>📎{e.files.length}</span></button>;})}
        </div>}
      </div>}
    </main>
    {(tab==="home"||tab==="timeline")&&<button className="fab" aria-label="Thêm trận mới" onClick={function(){setTab("add");setForm(mk());setEid(null);}}>➕</button>}
  </div>;
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
